<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Calendar body -->
  <rect x="10" y="20" width="100" height="90" rx="12" fill="#0d9488" opacity="0.15"/>
  <rect x="10" y="20" width="100" height="90" rx="12" stroke="#0d9488" stroke-width="5"/>
  <!-- Top bar -->
  <rect x="10" y="20" width="100" height="28" rx="12" fill="#0d9488"/>
  <rect x="10" y="36" width="100" height="12" fill="#0d9488"/>
  <!-- Binding rings -->
  <rect x="33" y="10" width="8" height="22" rx="4" fill="#0f766e"/>
  <rect x="79" y="10" width="8" height="22" rx="4" fill="#0f766e"/>
  <!-- Day dots grid (3×3) -->
  <circle cx="38" cy="68" r="5" fill="#0d9488" opacity="0.5"/>
  <circle cx="60" cy="68" r="5" fill="#0d9488" opacity="0.5"/>
  <circle cx="82" cy="68" r="7" fill="#0d9488"/>
  <circle cx="38" cy="90" r="5" fill="#0d9488" opacity="0.5"/>
  <circle cx="60" cy="90" r="5" fill="#0d9488" opacity="0.5"/>
  <circle cx="82" cy="90" r="5" fill="#0d9488" opacity="0.5"/>
</svg>
